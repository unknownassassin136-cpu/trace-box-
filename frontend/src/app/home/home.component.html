<div class="min-h-screen bg-gray-50 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl text-center">
    <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl lg:text-6xl mb-4">
      {{ title }}
    </h1>
    <h2 class="text-2xl font-bold text-gray-700 mb-6">
      {{ subtitle }}
    </h2>
    <p class="text-xl text-gray-500 mb-10 max-w-2xl mx-auto">
      {{ description }}
    </p>
    
    <div class="flex justify-center gap-4">
      <a routerLink="/dashboard" class="inline-flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-white bg-slate-900 hover:bg-slate-800 transition-colors md:py-4 md:text-lg md:px-10">
        Start Monitoring
      </a>
      <a routerLink="/demo" class="inline-flex items-center justify-center px-8 py-3 border border-slate-300 text-base font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 transition-colors md:py-4 md:text-lg md:px-10">
        View Demo
      </a>
    </div>
  </div>
</div>
