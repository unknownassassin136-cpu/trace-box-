<div class="min-h-screen bg-slate-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
      Admin Sign In
    </h2>
    <p class="mt-2 text-center text-sm text-slate-400">
      TraceNode Secure Access Portal
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-800 py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-slate-700">
      <form class="space-y-6" (ngSubmit)="login()">
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-md mb-4">
          {{ errorMessage }}
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-300">
            Email address
          </label>
          <div class="mt-1">
                        <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-slate-600 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-slate-900 text-white" placeholder="admin@gmail.com">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300">
            Password
          </label>
          <div class="mt-1">
            <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required class="appearance-none block w-full px-3 py-2 border border-slate-600 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-slate-900 text-white">
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
            <span *ngIf="isLoading">Signing in...</span>
            <span *ngIf="!isLoading">Sign in</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
