<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
      <p class="mt-2 text-sm text-gray-500">Manage device configurations and alarm limits.</p>
    </div>

    <!-- Smart Limits Panel -->
    <div class="bg-white rounded-lg shadow border border-gray-100 overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
        <div>
          <h3 class="text-lg font-medium text-gray-900">Device Alarm Limits (NODE-DEMO-01)</h3>
          <p class="text-sm text-gray-500 mt-1">Configure threshold limits. Hardware saves data only when these are breached.</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm font-medium" [ngClass]="{'text-green-600': saveStatus === 'Saved Successfully!', 'text-red-600': saveStatus === 'Error saving limits', 'text-gray-500': saveStatus === 'Saving...'}">
            {{ saveStatus }}
          </span>
          <button (click)="saveDeviceLimits()" [disabled]="isSavingLimits" class="bg-slate-900 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-slate-800 transition-colors shadow-sm disabled:opacity-50">
            Save Limits to DB
          </button>
        </div>
      </div>
      
      <div class="p-6">
        <h4 class="text-md font-medium text-gray-900 mb-4 border-b pb-2">Temperature (°C)</h4>
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 mb-8">
          <div>
            <label class="block text-sm font-medium text-gray-700">Min Temp</label>
            <input type="number" [(ngModel)]="deviceLimits.minTemp" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Max Temp</label>
            <input type="number" [(ngModel)]="deviceLimits.maxTemp" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
        </div>

        <h4 class="text-md font-medium text-gray-900 mb-4 border-b pb-2">Humidity (%)</h4>
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 mb-8">
          <div>
            <label class="block text-sm font-medium text-gray-700">Min Humidity</label>
            <input type="number" [(ngModel)]="deviceLimits.minHumidity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Max Humidity</label>
            <input type="number" [(ngModel)]="deviceLimits.maxHumidity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
        </div>

        <h4 class="text-md font-medium text-gray-900 mb-4 border-b pb-2">Ethylene (ppm)</h4>
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 mb-8">
          <div>
            <label class="block text-sm font-medium text-gray-700">Min Ethylene</label>
            <input type="number" [(ngModel)]="deviceLimits.minEthylene" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Max Ethylene</label>
            <input type="number" [(ngModel)]="deviceLimits.maxEthylene" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
        </div>

        <h4 class="text-md font-medium text-gray-900 mb-4 border-b pb-2">Shock (G-Force)</h4>
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-gray-700">Min Shock</label>
            <input type="number" step="0.1" [(ngModel)]="deviceLimits.minShock" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Max Shock</label>
            <input type="number" step="0.1" [(ngModel)]="deviceLimits.maxShock" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
